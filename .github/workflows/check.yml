name: check

on:
  push:
  pull_request:

jobs:
  posters:
    # pull requests may come from anyone: they run on GitHub's runners, not on the self-hosted one
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "opp"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: No binary file over 1 MiB (5 MiB for an image of a paper), and nothing of dist/, in git
        run: python engine/sizes.py
      - name: The engine package passes its tests
        run: python -m pytest -q engine/tests
      # the cache of the self-hosted runner keeps each poster, keyed on its files and those of the
      # engine: only the posters that changed are laid out again
      - name: Every poster fits its page, uses bundled fonts only and has its preview in docs/
        run: python engine/build.py --check --jobs "$(nproc)" --cache "$HOME/.cache/one-page-papers/build"
      - name: The catalog of the README is up to date, and no document links a file that git does not keep
        run: python engine/readme.py --check
      - name: The site has no dead internal link, loads nothing from another site but its analytics, and every PDF it links is in dist/
        run: python engine/site.py --check
