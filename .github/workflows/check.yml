name: check

on:
  push:
  pull_request:

jobs:
  posters:
    # pull requests may come from anyone: they run on GitHub's runners, not on the self-hosted one
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted", "opp"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: The engine package passes its tests
        run: python -m pytest -q engine/tests
      - name: Every poster fits its page, uses bundled fonts only and matches its PDFs in dist/
        run: python engine/build.py --check --jobs "$(nproc)"
      - name: The catalog of the README is up to date
        run: python engine/readme.py --check
      - name: Keep the PDFs that differ from dist/
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check
          path: build/check/
          if-no-files-found: ignore
      - name: The site has no dead internal link, loads nothing from another site but its analytics, and every PDF it links is in dist/
        run: python engine/site.py --check
