name: check

on:
  push:
  pull_request:

jobs:
  posters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Every poster fits its page and uses bundled fonts only
        run: python engine/build.py --check
      - name: The catalog of the README is up to date
        run: python engine/readme.py --check
