name: check

on:
  push:
  pull_request:

jobs:
  posters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - name: Every poster fits its page, uses bundled fonts only and matches its PDFs in dist/
        run: python engine/build.py --check
      - name: The catalog of the README is up to date
        run: python engine/readme.py --check
      - name: Keep the PDFs that differ from dist/
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check
          path: build/check/
          if-no-files-found: ignore
      - name: The site has no dead internal link, loads nothing from another site, and every PDF it links is in dist/
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils
          python engine/site.py --check
