name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and a deployment under way is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, opp]
    steps:
      - uses: actions/checkout@v5
        with:
          # the history, for the lastmod dates of the sitemap, without the files of past commits
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - name: Write the site into site/, which fails on a dead link or on a PDF missing from dist/
        run: python engine/site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: [self-hosted, opp]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
