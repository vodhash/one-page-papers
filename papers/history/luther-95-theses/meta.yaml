  edition: >-
    D. Martin Luthers Werke, Kritische Gesammtausgabe (Weimar edition), vol. 1, Weimar,
    Hermann Böhlau, 1883, pp. 233-238, edited by J. K. F. Knaake, whose text follows print A
    (a single-sheet print in folio ending "M.D.Xvij.", copy of the British Museum). The text
    comes from the OCR of the archive.org scan above; every line was read against its page
    scans and checked against a second copy (archive.org dmartinlutherswe11luth, Getty
    Research Institute), and 75 OCR errors were corrected. The spelling of the edition is
    kept (e for ae, Lutther, Hiesu, spiritussanctus, charitas, rhetia). The numbering is
    that of print A and of the edition, three series of 1 to 25 then 1 to 20; the edition
    gives the running numbers 1 to 95 only in its page heads, and the poster leaves a space
    between the series. Left out: running heads and page numbers, the line numbers of the
    edition, its critical apparatus (variants of prints B and C) and its marginal Bible
    references (Matth. 4, 17 at thesis 1; Hes. 13, 10. 16 at the 17th of the fourth series;
    Apgsch. 14, 22 at its 20th). Words divided at line ends are joined. One misprint of the
    edition, printed in both copies, is corrected: "iudulgentias" (6th thesis of the third
    series, p. 236) is set as "indulgentias". The preamble ("Amore et studio...") and the
    closing "M.D.Xvij." are set as in the edition, the preamble across the columns.
