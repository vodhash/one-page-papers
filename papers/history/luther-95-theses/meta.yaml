  basis: >-
    Martin Luther died on 18 February 1546 (Wikidata Q9554). The Weimar edition, vol. 1, was
    published in 1883; its editor J. K. F. Knaake, who signs the preface (p. XXII), died on
    6 April 1905 (de.wikipedia.org/wiki/Karl_Knaake). The text is in the public domain in
    France (authors died before 1 January 1956) and in the United States (published before
    1931). The archive.org item is marked with the Public Domain Mark 1.0.
