  edition: >-
    Transcript published by the John F. Kennedy Presidential Library and Museum on its
    Historic Speeches page (transcript 11766, English). The site was behind a browser check
    on 27 September 2026: the page was read from its capture of 1 August 2026 by the Internet
    Archive, and the transcript, which the page loads from
    jfklibrary.org/historic-speeches-transcripts-rest?nid=11766&langcode=en, from the capture
    of that address of 29 March 2024, identical to those of February 2023, October 2023 and
    February 2024. It is the text as delivered, not the reading copy: it has the President's
    asides and the audience's "[laughter]", as has the White House press release of the
    remarks of 12 September 1962, kept by the library in its folder JFKPOF-040-001 with the
    draft and the reading copy. Three possessives are typed with a superscript one (U+00B9)
    in place of the apostrophe ("man¹s", "America¹s", "year¹s"): they are set with an
    apostrophe. Everything else is kept as in the transcript, including its seven double
    hyphens (--), "[laughter]" and the slip "I do not say the we should".
