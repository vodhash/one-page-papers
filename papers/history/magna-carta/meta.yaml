  basis: >-
    The charter was granted in June 1215. The edition was published in Paris in 1892; its
    editor Charles Bémont was born on 16 November 1848 and died on 21 September 1939
    (Wikidata Q2958663; the archive.org record names him "Bémont, Charles, 1848-1939"). The
    text is in the public domain in France (the editor died before 1 January 1956) and in the
    United States (published before 1931).
