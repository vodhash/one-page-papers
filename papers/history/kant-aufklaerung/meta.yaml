  edition: >-
    Wikisource transcription (status "fertig") of the first printing,
    Berlinische Monatsschrift, vol. 4, twelfth issue (December 1784), pp. 481-494, checked
    line by line against the page scans of the Universitätsbibliothek Bielefeld
    (ds.ub.uni-bielefeld.de, record 2239816_004, images 513 to 526). The spelling and
    punctuation of 1784 are kept (Muth, Theil, Zwekke, räsonnirt, Despotism). Normalizations:
    the Fraktur letters are set in roman type (long s as s); words divided at line and page
    ends joined; running heads, page numbers, signatures and catchwords left out. Type: the letter-spaced words of the print are
    letter-spaced, the words in its heavier type are bold, and the Latin words, set in roman
    type within the Fraktur, are italic. The masthead of the issue (Berlinische
    Monatsschrift. 1784. Zwölftes Stük. December.) is summed up in the kicker and the footer,
    and the number of the article in the issue (1.) is left out; the title and the reference
    under it, (S. Decemb. 1783. S. 516.), are in the header. Kant's
    footnote, called with *) in the print, is numbered. Two misprints are corrected as in the
    Wikisource transcription, which records them: "der der Welt" (p. 492) and "zuükgehalten"
    (p. 494). The two dashes are en dashes, as in the transcription (the print has long
    rules). The notes of Wikisource and its bracketed expansions of abbreviations (S.[iehe],
    Decemb.[er], I.[mmanuel], Septemb.[er], Sept.[ember], dess.[elben]) are not in the print
    and are left out.
