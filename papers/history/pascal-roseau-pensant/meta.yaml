source:
  url: https://gallica.bnf.fr/ark:/12148/btv1b8606969h/f267.item
  retrieved: 2026-09-27
  edition: >-
    Excerpt: one fragment of chapter XXIII, "Grandeur de l'homme", of Pensées de M. Pascal sur
    la religion et sur quelques autres sujets, qui ont esté trouvées après sa mort parmy ses
    papiers, Paris, Guillaume Desprez, 1670, the first Port-Royal edition ([41] f., 365 p.),
    page 181, in the copy of the BnF on Gallica (view 267), from "L'homme n'est qu'un roseau"
    to "Voilà le principe de la morale.", its two paragraphs complete; the fragments before
    and after it in the chapter are left out, with the fleuron that opens each fragment. The
    words were taken from the proofread transcription of fr.wikisource of another 1670
    edition by Desprez (Index "Pascal - Pensées, 2e édition G. Desprez, 1670.djvu", pages
    258-259, from Gallica bpt6k577160), whose spelling is modernized, and were set back to
    the spelling of the print word by word against the page image of the first edition
    (foible, goute, tüer, écraseroit, seroit, tüe, sçait twice, luy, nostre, and "&" twice);
    the two 1670 prints were compared on this passage and differ only in "goute" (first
    edition) and "goutte", "de là" and "de la" (second). The long s is set as a round s, the
    word divided at a line end ("pen-ser") is joined, the space that the print leaves before
    some commas is dropped, and a no-break space is kept before the semicolons. The title of
    the poster is set from the fragment; the chapter title is in the kicker and the footer.
