title: "Déclaration des Droits de l'Homme et du Citoyen de 1789"
summary: "The preamble and seventeen articles of rights adopted by the French National Assembly in August 1789."
title_html: "Déclaration des Droits<br>de l’Homme <em>et du Citoyen</em>"
title_size: 96pt
kicker: "August 1789"
author: "Assemblée nationale"
