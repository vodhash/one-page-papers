source:
  url: https://www.conseil-constitutionnel.fr/le-bloc-de-constitutionnalite/declaration-des-droits-de-l-homme-et-du-citoyen-de-1789
  retrieved: 2026-09-27
  edition: >-
    The official text as published by the Conseil constitutionnel (La Constitution, Le bloc
    de constitutionnalité), in modern spelling: the preamble and articles 1 to 17, complete
    and unchanged, with the non-breaking spaces before ";" and ":" of the page; its straight
    apostrophes are set as typographic apostrophes. The title of the page, "Déclaration des
    Droits de l'Homme et du Citoyen de 1789", is the title of the poster, set on two lines
    without "de 1789", which is in the kicker. The dates in the kicker and in the footer
    come from the engraving of 1789 that the same page reproduces from Gallica (BnF), whose
    heading says that the articles were decreed by the National Assembly in its sessions of
    20, 21, 23, 24 and 26 August 1789 and accepted by the King.
