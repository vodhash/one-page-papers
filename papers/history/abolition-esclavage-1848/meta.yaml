  edition: >-
    The official text as printed in the Bulletin des lois de la République française, 10th
    series, vol. 1 (February to June 1848), bulletin n° 32, decree n° 296, pages 321 to 323
    (views 339 to 341 of the Gallica copy, BnF). The text comes from the OCR of these pages
    (ALTO files of Gallica), read word by word against the page images, which corrected its
    errors (misread letters, such as "d7appliquer" and "k." for "4.", and missing commas). Kept: everything from "Le Gouvernement provisoire," to "Signé Pagnerre.",
    with the spelling, capitals and italics of the print ("très-près", "A l'avenir",
    "Liberté, Égalité, Fraternité;" in italics). Left out: the running heads and page numbers,
    and the heading of the decree, "N° 296. Décret relatif à l'abolition de l'Esclavage dans
    les Colonies et Possessions françaises. Du 27 Avril 1848.", which is printed with the
    misprint "Escldvage": the title of the poster is the title of the decree on Légifrance
    (JORFTEXT000000295898), and the date is in the kicker. Words divided at line ends are
    joined; the space before the comma after "républicain" is dropped; the names that the
    print sets in small capitals are set in small capitals, and apostrophes are typographic.
