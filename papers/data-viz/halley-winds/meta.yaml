year: 1686
authors: [Edmond Halley]
min_print: A3
source:
  url: https://archive.org/details/philtrans09399630
  retrieved: 2026-09-27
  edition: >-
    Text: "An Historical Account of the Trade Winds, and Monsoons, observable in the Seas between
    and near the Tropicks, with an attempt to assign the Phisical cause of the said Winds, by E.
    Halley", Philosophical Transactions, vol. 16, no. 183 (1686), pp. 153-168
    (doi:10.1098/rstl.1686.0026), in the scan of JSTOR's Early Journal Content on the Internet
    Archive (philtrans09399630, which dates it 1753 by mistake). Excerpt: the first two
    paragraphs of p. 153, and the two paragraphs of pp. 162-163 that explain the map; the rest of
    the paper is left out. Transcribed from the OCR of the scan, corrected against the page
    images word by word (65 substitutions, most for the long s). The long s is set as s; the
    drop capital and small capital of "AN exact" are set as "An exact"; the space printed before
    semicolons and colons is dropped; words hyphenated at line ends are joined; the italics of
    the print are kept. "Monſ ons" on p. 163, where a letter is missing in the print, is read
    as Monsoons, as two lines below; "Æthiopick" on the same page, damaged in the print, is read
    as three lines above. Image: File:Edmond Halley's map of the trade winds, 1686.jpg on
    Wikimedia Commons (3323 x 1103 px, grayscale, from Princeton University Library), with its
    levels stretched (60 to 185) to remove the show-through of the text printed on the back.
