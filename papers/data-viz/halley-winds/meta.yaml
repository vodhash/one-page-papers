title: "Edmond Halley: An Historical Account of the Trade Winds, and Monsoons"
summary: "Halley's 1686 account of the trade winds and monsoons, with his map of the winds between and near the tropics."
title_html: 'An Historical Account of the <em>Trade Winds</em>, and Monsoons<span class="tsub">observable in the Seas between and near the Tropicks, with an attempt to assign the Phisical cause of the said Winds</span>'
title_size: 84pt
kicker: "Excerpt · Philosophical Transactions, no. 183 · 1686"
author: "Edmond Halley"
byline: "<i>Philosophical Transactions</i>, vol. 16, pp. 153-168, with a map of the winds"
emblem: "H"
header_scale: 1.8
layout: hero
hero_height: 25
columns: 3
