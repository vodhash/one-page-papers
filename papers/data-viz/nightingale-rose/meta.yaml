source:
  url: https://commons.wikimedia.org/wiki/File:Diagram_of_the_causes_of_mortality_in_the_army_Wellcome_L0041105.jpg
  retrieved: 2026-09-27
  edition: >-
    Photograph L0041105 of Wellcome Images (Wellcome Library, London, GC M:WA100 1858N68n) of the
    plate "Diagram of the Causes of Mortality in the Army in the East" of Florence Nightingale's
    Notes on Matters Affecting the Health, Efficiency, and Hospital Administration of the British
    Army (London, Harrison and Sons, 1858), as uploaded to Wikimedia Commons (3942 x 2566 px),
    converted from Adobe RGB to sRGB with its embedded profile and its paper tone scaled to white
    (one gain per channel) for the poster. The legend engraved on the plate is transcribed below
    the image, one printed item per paragraph, "Novr" with its superscript r (the two strokes
    under it are not reproduced). The transcription of the legend on the Wikimedia Commons page
    File:Nightingale-mortality.jpg, made from a later printing, served as a base and was corrected
    against this plate in eight places. The legend reads "January & February 1855" as engraved on
    this plate, although in Table No. 2 of the Notes (p. 315) the rates from zymotic diseases and
    from all other causes are close in January and February 1856, not 1855. The notice below the
    legend is not a period text: it was written for this poster from the title page, the List of
    Illustrations and Table No. 2 of the Notes, in the Wellcome Collection scan b20387118.
