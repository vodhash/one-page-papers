source:
  url: https://heritage.ecoledesponts.fr/ark:/12148/btv1b10484829h/f52.item
  retrieved: 2026-09-27
  edition: >-
    Minard's own copy at the École nationale des ponts et chaussées (Fol. 10975, recueil
    "Tableaux graphiques et cartes figuratives", view 52: two maps on one sheet, Regnier &
    Dourdet), scanned by the Bibliothèque nationale de France for Héritage des ponts et
    chaussées (ark:/12148/btv1b10484829h, 7888 x 5952 px). The poster shows the lower map
    only, cropped to its frame (the map of Hannibal's march above it is left out), straightened
    by 0.26 degree, reduced to 4234 px and with its paper tone scaled to white (one gain per
    channel). Until September 2026 the poster used the copy of the Bibliothèque nationale de
    France (Cartes et plans, GE DON-4182, Gallica btv1b52504201x), against which the text was
    first read; the two are the same printing. The text is transcribed from the BnF scan: the
    legend under the title, set in two paragraphs as on the map, the heading of the temperature
    chart and the note at its left. The title, author line and date of the map are in the
    header. The rule that separates two sentences of the legend is set as a dash; "M.M." and
    "zônes" are kept as written; "l'œil" is read with the ligature, which cannot be told from
    joined script; the title's "1812~1813" is set with a hyphen. The labels on the map (places,
    numbers of men, temperatures and dates) are not transcribed. No transcription of the legend
    was found to compare with: it was read on the scan word by word. The notice below the
    legend is not a period text: it was written for this poster from the map itself and the
    Gallica record (Minard's dates, the printer, the two maps on one sheet).
