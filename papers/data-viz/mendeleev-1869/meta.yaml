  holder: "Dmitri Mendeleev, 1869"
  basis: >-
    Dmitri Mendeleev died in 1907; the sheet and the paper were published in 1869, and the
    edition used in 1926, before 1931: public domain in the United States. Mendeleev died before
    1956, as did the editor of the 1926 edition, B. N. Menshutkin (died 1938), whose own text is
    not reproduced: public domain in France.
  note: >-
    Wikimedia Commons marks the image PD-old-100-1923
    (https://commons.wikimedia.org/wiki/File:1869-periodic-table.jpg); the Internet Archive marks
    the 1926 edition with the Public Domain Mark.
