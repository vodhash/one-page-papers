source:
  url: https://archive.org/details/mendeleev_periodic
  retrieved: 2026-09-27
  edition: >-
    Text: the conclusions, closing paragraph and footnote of "Соотношение свойств с атомным
    весом элементов" (Журнал Русского Химического Общества, vol. I, 1869, pp. 60-77), as
    reprinted in Д. И. Менделеев, Периодический закон, edited by B. N. Menshutkin (Классики
    естествознания 15, Moscow and Leningrad, Государственное издательство, 1926), pp. 19-20, in
    the reformed spelling of that edition. Transcribed from the OCR of the Internet Archive scan
    and corrected against the page images: element symbols, which the OCR misread, and letters
    damaged in the print, read as величине, различию, видно, сравнительному and эта, the
    footnote date read as 5 Апреля, and the full stop after "никакого внимания". The readings
    "прешествовавших" and "вопросы химии, В названном" are kept as printed in 1926 (the 1934
    edition of the same papers reads "предшествовавших" and "химии. В"). The dates are those
    of the 1926 edition, in the Julian calendar then used in Russia. Words hyphenated at line ends are joined
    ("взаимно-/действие" as взаимнодействие); the letter-spaced words of emphasis stay
    letter-spaced; the footnote marked 1) is numbered by the poster. The headings keep the
    capitals of the 1926 edition in the text, and are set in lower case in the title of the
    poster. Image: File:1869-periodic-table.jpg on Wikimedia Commons (1067 x 1312 px, a scan of a
    reproduction of the sheet, uploaded in 2007 without a source), in grayscale with its paper
    and show-through whitened for the poster (levels 15 to 215).
license:
