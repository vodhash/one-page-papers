title: "Опыт системы элементов, основанной на их атомном весе и химическом сходстве"
summary: "Mendeleev's system of the elements by atomic weight, sent to chemists in February 1869, with the conclusions of his paper."
title_html: 'Опыт системы элементов,<span class="tsub">основанной на их атомном весе и химическом сходстве</span>'
