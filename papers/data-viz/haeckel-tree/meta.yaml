  edition: >-
    Ernst Haeckel, Anthropogenie oder Entwickelungsgeschichte des Menschen (Leipzig, Wilhelm
    Engelmann, 1874, first edition), in the scan of the Wellcome Library copy on the Internet
    Archive (b28059189): plate XII, "Stammbaum des Menschen", bound between pages 496 and 497
    (scan n540, 2620 x 4323 px), cropped to the plate with its title and imprints and with its
    paper tone scaled to white (one gain per channel); the foxing of the paper is left as it
    is. The names printed on the plate are transcribed from the scan, grouped
    under the four divisions marked on its right edge and listed from the root to the crown,
    an order chosen for the poster, and separated by middle dots; the brackets are set as parentheses, the full stop after
    "Gastraeaden" is kept, and "Jnfusionsthiere", "Jnfusoria" and "Jnsecten" keep the J of the
    print. The plate's title and "Taf. XII." are in the header and the caption, not in the text.
    The entry of the plate in the list of plates (p. VI) is transcribed without its dotted
    leader. No transcription was found to compare with: the names were read on the scan word by
    word. The notice is not a period text: it was written for this poster from the title page,
    the list of plates, the plate and page 378 of this scan.
