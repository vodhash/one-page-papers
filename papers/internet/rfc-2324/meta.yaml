title: "RFC 2324: Hyper Text Coffee Pot Control Protocol (HTCPCP/1.0)"
summary: "An April Fools' RFC extending HTTP to control coffee pots; it defined the 418 I'm a teapot status code."
title_html: "Hyper Text Coffee Pot<br>Control Protocol <em>(HTCPCP/1.0)</em>"
