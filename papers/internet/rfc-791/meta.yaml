title: "RFC 791: Internet Protocol"
summary: "Section 3.1 of the Internet Protocol specification, which defines each field of the IPv4 header and its options."
title_html: "Internet Protocol<br><em>DARPA Internet Program</em>"
kicker: "Request for Comments 791 · Excerpt · September 1981"
author: "Jon Postel, Editor"
byline: "Information Sciences Institute · University of Southern California"
emblem: "IP"
abstract_label: "Preface."
abstract: >-
  This document specifies the DoD Standard Internet Protocol.  This
  document is based on six earlier editions of the ARPA Internet Protocol
  Specification, and the present text draws heavily from them.  There have
  been many contributors to this work both in terms of concepts and in
  terms of text.  This edition revises aspects of addressing, error
  handling, option codes, and the security, precedence, compartments, and
  handling restriction features of the internet protocol.
