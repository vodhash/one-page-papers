title: "RFC 1149: A Standard for the Transmission of IP Datagrams on Avian Carriers"
summary: "An April Fools' RFC on sending IP datagrams printed on a paper scroll wrapped around the leg of a bird."
title_html: "A Standard for the Transmission<br>of IP Datagrams <em>on Avian Carriers</em>"
title_size: 88pt
kicker: "Request for Comments 1149 · 1 April 1990"
author: "D. Waitzman"
byline: "Network Working Group · BBN STC"
emblem: "IP"
abstract_label: "Status of this Memo."
abstract: >-
  This memo describes an experimental method for the encapsulation of
  IP datagrams in avian carriers.  This specification is primarily
  useful in Metropolitan Area Networks.  This is an experimental, not
  recommended standard.  Distribution of this memo is unlimited.
