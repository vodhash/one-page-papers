title: "RFC 793: Transmission Control Protocol"
summary: "Section 3.1 of the Transmission Control Protocol specification, which defines each field of the TCP header and its options."
title_html: "Transmission Control Protocol<br><em>DARPA Internet Program</em>"
kicker: "Request for Comments 793 · Excerpt · September 1981"
author: "Jon Postel, Editor"
byline: "Information Sciences Institute · University of Southern California"
emblem: "TCP"
abstract_label: "Preface."
abstract: "This document describes the DoD Standard Transmission Control Protocol (TCP).  There have been nine earlier editions of the ARPA TCP specification on which this standard is based, and the present text draws heavily from them.  There have been many contributors to this work both in terms of concepts and in terms of text.  This edition clarifies several details and removes the end-of-letter buffer-size adjustments, and redescribes the letter mechanism as a push function."
