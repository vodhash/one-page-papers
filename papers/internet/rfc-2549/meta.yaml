title: "RFC 2549: IP over Avian Carriers with Quality of Service"
summary: "An April Fools' RFC amending RFC 1149 with quality of service levels for IP datagrams carried by birds."
title_html: "IP over Avian Carriers<br><em>with Quality of Service</em>"
title_size: 92pt
kicker: "Request for Comments 2549 · Experimental · Updates 1149 · 1 April 1999"
author: "D. Waitzman"
byline: "Network Working Group · IronBridge Networks"
emblem: "QoS"
abstract_label: "Abstract."
abstract: "This memo amends RFC 1149, \"A Standard for the Transmission of IP Datagrams on Avian Carriers\", with Quality of Service information. This is an experimental, not recommended standard."
header_scale: 1.6
columns: 3
footer:
  - "<b>Status of this Memo.</b> This memo defines an Experimental Protocol for the Internet community.  It does not specify an Internet standard of any kind. Discussion and suggestions for improvement are requested. Distribution of this memo is unlimited."
