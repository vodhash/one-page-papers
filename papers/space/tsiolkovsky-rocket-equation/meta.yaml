  edition: >-
    The 1903 printing of the paper (Научное обозрение, St. Petersburg, 1903, No. 5, pp. 45-75)
    could not be found as a scan: it is not on Wikimedia Commons, Russian Wikisource, the
    Internet Archive or Google Books, the Presidential Library and the Belinsky Library offer
    only the 1926 edition online, and the National Electronic Library and the Russian State
    Library could not be reached on 27 September 2026. This poster therefore gives Tsiolkovsky's own revised text of 1926,
    in the orthography of 1926: К. Циолковский, Исследование мировых пространств реактивными
    приборами (переиздание работ 1903 и 1911 г. с некоторыми изменениями и дополнениями),
    Kaluga, 1-я Гостипография ГСНХ, 1926, 127 pages, no title page, from the scan of the copy of
    the Belinsky Library, Yekaterinburg (file 0058711.pdf of the record
    https://elib.uraic.ru/handle/123456789/66176, 134 pages, with an ABBYY FineReader text
    layer, 2023; the record states "Свободный доступ"). Another copy of the same edition is
    on the Internet Archive (https://archive.org/details/issledovaniemirovyhprostranstvreaktivnym67,
    from the Omsk regional library); it was not used. Excerpt: the whole section "Движение
    ракеты от взрывания в пустоте и в среде свободной от тяжести", printed pages 36 (last
    paragraph) to 43 (PDF pages 38 to 45), up to the next section, "Движение ракеты в среде
    тяжести, в пустоте", with formulas 32 to 46 and Table 6. The prose was taken from the text
    layer, which had already rejoined the words hyphenated at line ends, and checked word by
    word against the page images; the text layer was corrected where it misread the variables
    and the words next to formulas ("(Ие)" for "(Le)", "О" for "0", "(39і)", "Мр=Мр^Мо",
    "(аМо : dBp)", "наименьМо, тему" for "наименьшему", and similar), and the formulas were
    set in KaTeX from the page images, with their numbers and the words printed on their lines
    ("Отсюда", "Следовательно:", "В таком случае", "Из 34 найдем:", "Из (39₁) найдем:", "В
    первом случае", "а во втором", "или, точнее:", "(x) близко к 4"). The formulas keep the
    printed notation: Cyrillic names of the quantities (Ско, Скр, Мо, Мр, Вр, То, Ро, Рр, Ур,
    Пост), Le for the natural logarithm, a point for multiplication, the numbering 38.. and
    39₇.. with two points, and the printed signs, including "Ско+То" in the denominators of
    39₆ to 39₈, "Мо₁ . Мр₁" in 45 and "Ско₁" in 42, which may be misprints. The subscript 1 of
    the quantities is set as a subscript in the prose too. The line "или, на основании 38₉ :",
    set on the line of formula 43, is set as a paragraph before it; "где (То) есть постоянная
    относительная тяжесть. Отсюда:", printed on the line of formula 39₁, after it. Table 6,
    printed on page 42 within the paragraph that ends on page 43, follows that paragraph; its
    headings, 27 rows and the note of its fifth column ("На деле поднятие выше, ибо тяжесть
    ослабляется.", printed vertically) were transcribed from the page image and checked
    against the text layer. The run-in section title and the word "постоянной" are bold, as
    printed. The "x" of the last formula and of "(x)" in the prose is set as a Latin x, as in
    formula 44. Page numbers and running heads are dropped.
