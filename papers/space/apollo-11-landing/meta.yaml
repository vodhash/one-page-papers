source:
  url: https://archive.org/details/Apollo11Audio
  retrieved: 2026-09-27
  edition: >-
    Scan of "Apollo 11 Technical Air-to-Ground Voice Transcription (GOSS NET 1)", NASA Manned
    Spacecraft Center, Houston, July 1969 (626 pages, file AS11_TEC.pdf), in the item Apollo11Audio
    of the Internet Archive, uploaded in 2010 by the Houston Audio Control Room of the NASA Johnson
    Space Center (uploader john.l.stoll@nasa.gov). Excerpt: the Introduction (page 2 of the scan)
    and the whole of tape 66/4 to 66/12 from the first entry after the ignition of the descent
    engine, 04 06 33 09, to the end of page 317, 04 06 47 20, that is transcript pages 309 (last
    entry) to 317. The text was taken from the retyped edition of the transcript kept by the
    Apollo Lunar Surface Journal (https://apollojournals.org/alsj/a11/a11transcript_tec.pdf, 2005)
    and checked word by word against the page images of the scan, which is followed where they
    differ; the scan was preferred to the retype in ten places: "Stand by." (retype "Stand by,"),
    "real good. ... about on." (". . . real good . . . . about on."), "Our position" ("Our.
    position"), "Stand by." ("Stand by.,"), "that alarm." (no period), "DELTA-H" twice ("DELTA
    H"), "Roger. We copy" ("Roger, We"), "- - ..." ("--") and the speaker of 04 06 35 54, which
    the scan gives on one line as for CC, faintly, where the retype has LMP (EAGLE); the Apollo
    Lunar Surface Journal also gives these words to the capsule communicator. Parts of the scan
    are faint; the words and times that cannot be read on it are those of the retype: in 04 06 35
    54 "good to us" and the 3 of "3 minutes", in 04 06 41 51 the 9 of "9 minutes", and the times
    04 06 36 36, 04 06 38 59, 04 06 42 22, 04 06 43 32, 04 06 43 51, 04 06 44 45, 04 06 45 08, 04 06
    45 52 and 04 06 46 06, in part. Ellipses, typed "..." on the scan and ". . ." in the retype,
    are set "..."; the typewriter's hyphens used as dashes ("- -") are kept; straight quotes are set
    as typographic quotes. Running heads (GOSS NET 1, tape and page numbers) are dropped and the
    heading "Tapes 66/4 to 66/12" is added; the speaker's station, in parentheses under the speaker
    on the scan, is set in italic after it. A handwritten note in the margin of page 317, "4:18 pm
    EDT" with an arrow to 04 06 45 59, is not reproduced. The communicator list of the Introduction
    is set as a table.
