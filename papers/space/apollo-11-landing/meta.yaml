title: "Apollo 11 Technical Air-to-Ground Voice Transcription: the landing"
summary: "NASA's transcript of the radio exchanges between Houston and Eagle from powered descent to the landing on the Moon."
title_html: "Apollo 11 Air-to-Ground<br><em>Voice Transcription</em>"
title_size: 84pt
kicker: "Excerpt · Powered descent and landing · GOSS NET 1 · 20 July 1969"
author: "National Aeronautics and Space Administration"
byline: "Manned Spacecraft Center, Houston, Texas · Prepared for the Data Logistics Office, Test Division, Apollo Spacecraft Program Office · July 1969"
emblem: "11"
header_scale: 1.5
