  edition: >-
    Photograph GPN-2000-001978 of NASA's Great Images in NASA collection (JPL number p24652b,
    dated 4 September 1977, "Creator/Photographer: NASA", NASA Center: Jet Propulsion Laboratory;
    record read from its capture of 11 September 2011 by the Internet Archive,
    https://web.archive.org/web/20110911125940/http://grin.hq.nasa.gov/ABSTRACTS/GPN-2000-001978.html),
    as uploaded to Wikimedia Commons (2215 x 2215 px, SHA-256
    89f8666e15f201cf4d428bc3e4d9bd11e064cedcac212a13f2124bc556055cff). For the poster the black
    background around the disc is made transparent: an ellipse fitted by eye to the rim of the
    disc (centre 1106, 1110; radii 1071 and 1065 px) keeps the disc, antialiased, and the image is
    cropped to it (2151 x 2139 px) and saved as WebP at quality 90. The part of the flare at the
    upper right that lies outside the rim is dropped with the background. The colours are those of
    the photograph. The cover bears no words, only engraved diagrams and binary numbers, so the
    poster has no text to transcribe. The notice below the image is not a period text: it was
    written for this poster, and every fact in it comes from two NASA pages, "The Golden Record
    Cover" (https://science.nasa.gov/mission/voyager/golden-record-cover/) and "Golden Record
    Overview" (https://science.nasa.gov/mission/voyager/voyager-golden-record-overview/), both
    retrieved on 27 September 2026, and from the NASA description of GPN-2000-001978.
