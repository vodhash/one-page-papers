title: "Sur une substance nouvelle radio-active, contenue dans la pechblende"
summary: "The Curies separate from pitchblende a substance far more active than uranium and name its presumed new metal polonium."
title_html: "Sur une substance nouvelle <em>radio-active</em>,<br>contenue dans la pechblende"
