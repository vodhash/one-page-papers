  retrieved: 2026-09-27
  edition: >-
    Scan of the Comptes rendus hebdomadaires des séances de l'Académie des sciences, vol. 127
    (July-December 1898), pp. 175-178, from the University of Toronto copy on the Internet
    Archive (surunesubstancen127curi, the whole volume, 400 ppi), checked against the Gallica
    scan of the same volume (https://gallica.bnf.fr/ark:/12148/bpt6k3083q/f177, views 177 to
    180). The text was taken from the French Wikisource transcription, proofread ("corrigé"), of the reprint
    in the Œuvres de Pierre Curie (Paris: Gauthier-Villars, 1908, pp. 335-338,
    https://fr.wikisource.org/wiki/Œuvres_de_Pierre_Curie/23), compared word by word with the
    ABBYY OCR of the Internet Archive scan, and every difference was settled on the scans. Eight
    readings of the 1908 reprint are brought back to the 1898 print: "l'uranium" (not
    "L'uranium"), the commas after "photographiques", "indication" and "Cependant", "et le"
    (not "etle"), "les parties plus chaudes" (not "régions"), "simples;" and "remarquer que si"
    (without a comma). The heading "PHYSICO-CHIMIE." and the author line "Note de M. P. Curie et
    de Mme S. Curie, présentée par M. Becquerel." are in the header, the session date is that of
    the heading of the session (Monday 18 July 1898) in the same volume. The note called from
    the title is set under the header without its call, since the two notes of the text are
    numbered 1 and 2 by the poster (1 on p. 176 and 1 on p. 178 in the print). The guillemets
    that open the note and each paragraph and close the note are kept, as printed. Running
    heads, page numbers and the signature line are left out, and hyphens at line ends are
    rejoined. Names in small caps stay in small caps; the italics are those of the print.
