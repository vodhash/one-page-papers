abstract_label: ""
abstract: "Ce travail a été fait à l’École municipale de Physique et Chimie industrielles. Nous remercions tout particulièrement M. Bémont, chef des travaux de Chimie, pour les conseils et l’aide qu’il a bien voulu nous donner."
