  retrieved: 2026-09-27
  edition: >-
    Scan of the Verhandlungen der Deutschen Physikalischen Gesellschaft, Zweiter Jahrgang
    (Leipzig: Johann Ambrosius Barth, 1900), no. 17, pp. 237-245, digitized by Google from the
    Harvard College Library copy (Internet Archive, verhandlungende01goog, 600 ppi). No proofread
    transcription was found (German Wikisource has only the later paper in Annalen der Physik
    4, 1901): the text was transcribed line by line from the scan and checked word by word
    against it, with the OCR of the Internet Archive as a cross-check. The title, "von M.
    Planck." and "(Vorgetragen in der Sitzung vom 14. December 1900.)" are in the header; the
    cross-reference "(Vgl. oben S. 235.)" to the minutes of the session is left out; running
    heads and page numbers are left out and hyphens at line ends are rejoined. The footnotes,
    numbered from 1 on each page of the scan, are numbered 1 to 12 and follow the text. Names in
    small caps stay in small caps. Spelling, punctuation and misprints are kept, among them the
    exponents 8 of nu and c in the formula for u dnu of p. 242, where 3 is meant (checked on the
    bilevel scan: both glyphs have two closed bowls, while the superscript 3 of c^3 on p. 241 and
    of 10^23 on p. 244 has an open lower bowl, and their bitmaps occur nowhere else in their
    JBIG2 symbol group, so they are not a compression artifact), and "die einzige ist. welche"
    in the note of p. 243. The equations are set with KaTeX, and the example of a
    complexion as a two-row array.
