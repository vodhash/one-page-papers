title: "On the Relative Motion of the Earth and the Luminiferous Ether"
summary: "An interferometer turning on a stone floating on mercury detects no appreciable motion of the earth relative to the ether."
title_html: "On the Relative Motion of the Earth<br>and the <em>Luminiferous Ether</em>"
