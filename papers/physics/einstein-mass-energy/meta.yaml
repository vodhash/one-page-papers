  edition: >-
    German Wikisource transcription (marked "korrigiert"), made from the scan of Annalen der
    Physik, 4th series, vol. 18 (Leipzig: Johann Ambrosius Barth, 1905), pp. 639-641, on the
    Internet Archive (annalenderphysi143unkngoog) and on Wikimedia Commons
    (File:Einstein-Energieinhalt.djvu), checked word by word and formula by formula against
    that scan. Corrected against the scan: "leeren Baum" to "leeren Raum" (p. 639); the signs of
    (H0 - E0) - (H1 - E1), for which Wikisource has plus signs (p. 640); the full stop that ends
    the equation for H0 (p. 640); "Betrag," to "Betrag." (p. 641). The title and "von A.
    Einstein." are in the header, whose byline restates in English the closing lines "Bern,
    September 1905. (Eingegangen 27. September 1905.)", which stay at the end of the text; the
    article number "13.", running heads, page numbers and the sheet signature "42*" are left out,
    and hyphens at line ends are rejoined. The two footnotes keep their numbers and follow the
    text. Letter-spaced names stay letter-spaced. The equations are set with KaTeX: the equations
    for E0 and H0, and those for H0 - E0 and H1 - E1, are each one aligned display as in the
    scan, the parentheses around the coordinate triples (x, y, z) are set with the letters they
    enclose, and the multiplication point of "9 . 10^20" keeps its spaces.
