  edition: >-
    Page scans of the article in PubMed Central (pnas01016-0006.pdf, 600 ppi) and their OCR
    layer, corrected word by word, number by number, against the scans. The title, printed in
    italic capitals, is set in upper and lower case in the header, with the author line "By
    Edwin Hubble" (as "Edwin Hubble"), the affiliation and the date line "Communicated January
    17, 1929"; the volume, issue and date of the kicker and the footer are those of the PubMed
    Central record. Page 168 opens with the end of another article, left out. Running heads and
    page numbers are dropped, words hyphenated at line ends are rejoined (the hyphens of "extra-galactic" and
    "velocity-distance", which fall at line ends, belong to the words and are kept), and the
    superscript footnote numbers are footnote calls, the notes being listed at the end of the
    text. Tables 1 and 2 and the two solutions of page 170 are set as tables in the type of the
    poster, the equation of condition with KaTeX. Figure 1 is the file
    Edwin_Hubble_velocity-distance_relation_1929.png of Wikimedia Commons (1323 x 796 px, taken
    from the PNAS edition at https://www.pnas.org/doi/epdf/10.1073/pnas.15.3.168), stored as
    8-bit grayscale without its opaque alpha channel, every pixel unchanged; in the journal it
    interrupts the paragraph that starts "Secondly," after "N. G. C. 404", on the poster it
    comes just before that paragraph. Its number, title and caption are those printed under it.
