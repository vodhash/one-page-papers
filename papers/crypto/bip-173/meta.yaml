  edition: >-
    The MediaWiki source of BIP 173 in the repository github.com/bitcoin/bips at commit 02bebeb
    of 25 September 2026, its current version (status Deployed, with the section Disclosures
    added in 2024; last changed on 12 January 2026, when its preamble fields were renamed). The
    full text. The preamble is in the header (title, number, layer, type, assigned date, authors
    and their addresses) and in the footer (its other fields but Comments-Summary and
    Comments-URI, a link to the wiki of the repository). The eight notes, which the source
    sets as numbered footnotes forming its section Rationale, between the Compatibility and
    Reference implementations sections, are numbered in the same order and listed at the end of
    the text, under that heading. Links show their text, and bare URLs are set in monospace.
    Lists nested in lists are kept nested, tables are set as tables, and preformatted blocks
    (Python code, test vectors) in monospace. Straight quotes of the text are set as typographic
    quotes. After the Copyright section is the text of the BSD 2-Clause License as SPDX gives it
    (https://spdx.org/licenses/BSD-2-Clause.html), without its template copyright line, as the
    BIP has no copyright line.
    The signs ≤ and ≥ of the table headings are set in the KaTeX_Main font, as EB Garamond lacks
    them in italic, and the brackets of [33-126] are written as HTML entities, so that the engine
    does not take the range for a citation.
