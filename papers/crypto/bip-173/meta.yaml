title: "BIP 173: Base32 address format for native v0-16 witness outputs"
summary: "Defines Bech32, a checksummed base32 format, and the segwit addresses built on it, starting with bc1."
title_html: "Base32 address format for<br><em>native v0-16 witness outputs</em>"
