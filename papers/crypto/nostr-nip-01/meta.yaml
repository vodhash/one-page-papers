  edition: >-
    The Markdown source of NIP-01 in the repository github.com/nostr-protocol/nips at commit
    b82211e of 25 September 2026, its current version; the file was last changed by commit
    c3fd9af of 4 September 2026 (SHA-256 of the file
    6cd76682e7ec2d635f1f46b3660f621cdad1193d9174d316674b91f8d683af26). Its first lines are in
    the header: the title NIP-01, the subtitle "Basic protocol flow description" and the three
    status labels draft, mandatory and relay. Links show their text only (the Schnorr signature
    standard, NIP-10 and the extra metadata fields of NIP-24), underscores for emphasis are set
    in italics, and straight quotes outside code are set as typographic quotes. Lists nested in
    another list are set as nested bulleted lists; the two bullet styles of the source (- and
    *) are both set as bullets, ragged right. Code blocks and code spans are kept character for
    character: a line of a code block longer than the column wraps and hangs under its own
    indentation, and a long code span may break between two characters at a line end.
    The authors: the file was moved from fiatjaf's earlier nostr repository by fiatjaf on
    1 May 2022, and 44 author names (a few of them one person under two names) appear in its
    history since.
