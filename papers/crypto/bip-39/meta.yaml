title: "BIP 39: Mnemonic code for generating deterministic keys"
summary: "Encodes entropy as a sentence of words from a 2048-word list, shown in full, then derives a binary seed."
title_html: "Mnemonic code for generating<br><em>deterministic keys</em>"
