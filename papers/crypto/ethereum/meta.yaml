source:
  url: https://ethereum.org/whitepaper/
  retrieved: 2026-09-27
  edition: >-
    The whitepaper as published on ethereum.org, from the source of that page,
    public/content/whitepaper/index.md in github.com/ethereum/ethereum-org-website (commit
    14ee8a9 of 28 June 2026, identical on the dev and master branches), checked word for word
    against the live page. Left out: the banner of the page ("Before you read") and the three
    editorial notes of ethereum.org, one before the paper ("While several years old, we
    maintain the original paper below...") and two after it (on the history of the whitepaper
    and the latest developments of Ethereum). The first heading of the page, the title of the
    paper, is in the header, prefixed with "Ethereum:" as in the PDF that the page offers
    (Ethereum_Whitepaper_-_Buterin_2014.pdf); the kicker gives the year that the page states
    ("This whitepaper was published in 2014"). Links show their text only; the note calls fn1
    to fn3 and the link "How?" stay superscripts; the table of the issuance model and the
    nested list of the GHOST section are set in HTML; straight quotes are set as typographic
    quotes, except in code. The code blocks are as on the page, including the backslashes that
    the page shows in the code of the Fees section. The six figures are the PNG files of the
    page, unchanged, on a light plate in the dark themes. The MIT License of the repository
    follows the paper in small print.
