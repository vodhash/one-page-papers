title: "Ethereum: A Next-Generation Smart Contract and Decentralized Application Platform"
summary: "Proposes Ethereum, a blockchain with a built-in Turing-complete language for contracts that encode arbitrary state transition functions."
title_html: "Ethereum: <em>A Next-Generation Smart Contract</em><br>and Decentralized Application Platform"
title_size: 64pt
kicker: "Ethereum Whitepaper · 2014"
author: Vitalik Buterin
emblem: ETH
columns: 6
font_range: [5, 12]
footer:
