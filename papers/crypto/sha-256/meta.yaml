title: "Secure Hash Standard (SHS): SHA-256"
summary: "Specifies SHA-256: its functions, constants, message padding and parsing, initial hash value and hash computation."
title_html: "Secure Hash Standard<br><em>SHA-256</em>"
kicker: "Excerpt · FIPS PUB 180-4 · August 2015"
author: "National Institute of Standards and Technology"
byline: "Information Technology Laboratory · Gaithersburg, MD 20899-8900"
emblem: "256"
abstract_label: Abstract
abstract: "This standard specifies hash algorithms that can be used to generate digests of messages. The digests are used to detect whether messages have been changed since the digests were generated."
columns: 3
