authors: [National Institute of Standards and Technology]
min_print: A3
source:
  url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.180-4.pdf
  retrieved: 2026-09-27
  edition: >-
    FIPS PUB 180-4, Secure Hash Standard (SHS), August 2015 (https://doi.org/10.6028/NIST.FIPS.180-4),
    the PDF published by NIST (36 pages, 833315 bytes, SHA-256
    0455b406d89648d20cbde375561e19c245b9815e894164c2670772e3d54deb82). Excerpt: the abstract (its
    two sentences, without the key words) in the header, then the sections that define SHA-256,
    complete and in their order: 2.2.1 Parameters, 2.2.2 Symbols and Operations, 4.1.2 SHA-224 and
    SHA-256 Functions, 4.2.2 SHA-224 and SHA-256 Constants, 5.1.1 (padding), 5.2.1 (parsing), 5.3.3
    (initial hash value of SHA-256), 6.2 SHA-256 with 6.2.1 and 6.2.2; the other sections, and the
    headings of sections 2.2, 5, 5.1, 5.2 and 5.3 with their introductions, are left out. The prose
    comes from pdftotext and was checked word for word against the pages; four words split at a
    line end are rejoined with the hyphen of the printed page (w-bit, 32-bit, right-most,
    SHA-256). Formulas, the padding example and the hash computation, which pdftotext cannot read,
    are set in KaTeX from the page scans, with the symbols of the Standard (the assignments of 6.2.2
    are "=" as printed). The 64 constants of 4.2.2 are set eight to a row as printed;
    they and the initial hash value were checked against the cube and square
    roots of the first primes. Superscript ordinals (ith, jth, tth, (i-1)st) and the italics and
    bold of the page are kept.
