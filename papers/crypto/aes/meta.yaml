title: "Advanced Encryption Standard (AES)"
summary: "Specifies the AES block cipher: the state, its four round transformations with the S-box, and the key expansion."
title_html: "Advanced Encryption<br><em>Standard (AES)</em>"
kicker: "Excerpt · FIPS 197 · Published 26 November 2001 · Updated 9 May 2023"
author: "National Institute of Standards and Technology"
byline: "Information Technology Laboratory · Federal Information Processing Standards Publication 197"
emblem: "AES"
abstract_label: Explanation
abstract: "The Advanced Encryption Standard (AES) specifies a FIPS-approved cryptographic algorithm that can be used to protect electronic data. The AES algorithm is a symmetric block cipher that can encrypt (encipher) and decrypt (decipher) digital information. The AES algorithm is capable of using cryptographic keys of 128, 192, and 256 bits to encrypt and decrypt data in blocks of 128 bits."
