source:
  url: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197-upd1.pdf
  retrieved: 2026-09-27
  edition: >-
    FIPS 197, Advanced Encryption Standard (AES), published 26 November 2001 and updated 9 May
    2023 (NIST FIPS 197-upd1, https://doi.org/10.6028/NIST.FIPS.197-upd1), the PDF published by
    NIST (46 pages, 1184436 bytes, SHA-256 62c86eb567f13edb8f71826e985da870b04ef6381634f303cdb16e84d47becd1).
    The update is used rather than the 2001 text: its algorithm is the same, and its text,
    notation and figures are the current ones. Excerpt: item 3 (Explanation) of the announcement
    in the header, then, complete and in their order, Sections 3.4 The State, 3.5 Arrays of Words,
    4.2 Multiplication in GF(2^8), the introduction of Section 5 with Table 3 and its footnote,
    5.1 CIPHER() with Algorithm 1, 5.1.1 to 5.1.4 with Table 4 (the S-box) and Figures 1 to 5, and
    5.2 KEYEXPANSION() with Table 5 and Algorithm 2; the closing sentence of 5.2, which points to
    Figures 6 to 8 (not reproduced), and all other sections are left out. The prose comes from
    pdftotext and was checked word for word against the pages; the PDF gives no text for the fi
    and ffi ligatures, which were restored as printed (specified, first, final, fixed, field,
    coefficient and the like), and two words split at a line end are rejoined as printed
    (four-by-four, appropriate). Formulas, matrices and the pseudocode are set in KaTeX from the
    page scans (the words of the pseudocode were compared with the extracted text by script), with
    function names in small capitals as in the Standard. Tables 3, 4 and 5 are set from the
    extracted text; the S-box and the round constants were checked by computing them. The
    sentence that Table 4 interrupts in the Standard is set whole before the table. The footnote
    is numbered 1 on the poster (2 in the Standard). Figures 1 to 5 are redrawn as vector graphics
    after the figures of the Standard, without their shadows; their captions are set below them.
