source:
  url: https://github.com/bitcoin/bitcoin/blob/ed7dd7cf4e1561a97edf72eba29a67b14e28c717/src/kernel/chainparams.cpp
  retrieved: 2026-09-27
  edition: >-
    An original layout for this project. The bytes come from CreateGenesisBlock in
    src/kernel/chainparams.cpp of Bitcoin Core at commit ed7dd7c of 25 September 2026 (SHA-256 of
    the file cfadf1478377c32625280520655b598674e6d487f08d7f7a80ac69252104b5e1): the arguments of
    the main network (time 1231006505, nonce 2083236893, bits 0x1d00ffff, version 1, reward
    50 * COIN), the timestamp text pszTimestamp, the output public key, and the construction of
    the coinbase script (486604799, then CScriptNum(4), then the text); COIN is 100,000,000
    (src/consensus/amount.h at the same commit). A script serialized the block from these values
    (285 bytes); its merkle root and block hash equal the two values that chainparams.cpp asserts,
    and its coinbase script equals the one in the comment above the function. The 285 bytes are
    identical to the raw block served on 27 September 2026 by
    https://blockstream.info/api/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f/raw
    and by https://mempool.space/api/block/000000000019d6689c085ae165831e934ff763ae46a2a6c172b3f1b60a8ce26f/raw
    (SHA-256 of the bytes 5299fac924b5a2fc19a88876a0042c19ac4d11fe69c3f66e47516e26185f9e99), and
    the first 80 to the header served by blockstream.info. Every decoded value on the poster (date
    in UTC, target, hashes, amounts) is computed from the bytes by the same script; the
    difficulty follows GetDifficulty in src/rpc/blockchain.cpp at the same commit. The quotations
    of the source (the timestamp text and the remark that the output "cannot be spent since it
    did not originally exist in the database") are copied from the file. The explanations are
    written for the poster.
