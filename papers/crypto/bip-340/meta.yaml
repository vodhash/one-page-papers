title: "BIP 340: Schnorr Signatures for secp256k1"
summary: "Specifies 64-byte Schnorr signatures and 32-byte public keys over the secp256k1 curve, with batch verification."
title_html: "Schnorr Signatures<br><em>for secp256k1</em>"
