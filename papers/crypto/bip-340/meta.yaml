  edition: >-
    The MediaWiki source of BIP 340 in the repository github.com/bitcoin/bips at commit 02bebeb
    of 25 September 2026, its current version (status Deployed; last changed on 12 January 2026,
    when its license fields were written as SPDX codes). The full text. The preamble is in the
    header (title, number, type, assigned date, authors and their addresses) and in the footer
    (its other fields but Comments-Summary and Comments-URI, a link to the wiki of the
    repository). The 17 notes, which the source sets as numbered footnotes under the heading
    Footnotes between the Changelog and the Acknowledgements, are numbered in the same order and
    listed at the end of the text, under that heading. Links show their text, and the bare URL is
    set in monospace; the files that the section Test Vectors and Reference Code links to (test
    vectors in CSV, reference code in Python) are not reproduced. Lists nested in lists are kept
    nested. Straight quotes of the text are set as typographic quotes. After the Copyright section
    is the text of the BSD 2-Clause License as SPDX gives it
    (https://spdx.org/licenses/BSD-2-Clause.html), without its template copyright line, as the
    BIP has no copyright line.
    The signs ≥, ± and ⋅, which EB Garamond lacks in italic (and ⋅ in every style), are set in
    the KaTeX_Main font, and ≠, which no bundled font has, is drawn by KaTeX as \neq.
