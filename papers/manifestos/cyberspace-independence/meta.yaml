title: "A Declaration of the Independence of Cyberspace"
summary: "John Perry Barlow's 1996 declaration, written at Davos, that governments have no sovereignty over cyberspace."
title_html: "A Declaration of the<br><em>Independence of Cyberspace</em>"
title_size: 104pt
kicker: "Davos, Switzerland · 8 February 1996"
author: "John Perry Barlow"
header_scale: 1.6
columns: 2
footer:
  - "“If you find it useful, I hope you will pass it on as widely as possible.” John Perry Barlow, 9 February 1996"
  - ""
