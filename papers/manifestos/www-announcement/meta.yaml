  edition: >-
    The two articles that Tim Berners-Lee posted to alt.hypertext on 6 August 1991, as archived
    in plain text on w3.org and linked from https://www.w3.org/History.html: art-6484.txt ("Re:
    Qualifiers on Hypertext links...", which https://web30.web.cern.ch/web-history.html calls the
    first announcement) and art-6487.txt ("WorldWideWeb: Summary"). They are reproduced line for
    line in a monospaced font, headers and signatures included, tabs at eight columns; only the
    line ends (CR LF) and the blank lines at the end of each file are dropped. The kicker, the
    title, the author line and the byline come from the headers and signatures of the posts.
