  edition: >-
    Excerpt: the double-page table Regnum Animale of the first edition of Systema Naturæ (Leiden,
    Theodor Haak, 1735), from the scan of the copy of the U.S. Department of Agriculture,
    National Agricultural Library, on the Internet Archive (Cat31011605, 400 ppi). In that copy
    the two pages of the table are leaves 10 and 13 of the scan, separated by the Observationes
    in Regnum Animale; for the poster they are cropped to the printed frame and joined as a
    spread, the right page scaled by 97.8% to the height of the left, in grayscale with the
    paper whitened (levels 6% to 88%) and reduced to 6400 px wide. Below the image, the headings
    of the six classes and the section PARADOXA of column III are transcribed from the OCR of
    the same scan, corrected word by word against its page images: the long s is set as s and
    the ligature ct as c t; the spaces before , ; : and . are not kept; words hyphenated at line
    ends are joined; the accents (valdè, verò, temerè, allegoricè, fabulosè, à, è) and italics
    of the print are kept, and its small capitals are set as small capitals. A new paragraph
    starts at each paradox, as in the print. The genera, characters and species of the table,
    and the note on the class Amphibia above the Paradoxa, are only in the image.
