  edition: >-
    The paper as printed in the British Journal of Experimental Pathology, vol. X, no. 3 (June
    1929), pp. 226-236, with the two plates of Figs. 1 to 4, from the scan in PubMed Central
    (PMC2048009, file brjexppathol00255-0037.pdf, 13 pages at 600 ppi). Its text layer was
    corrected word by word against the page images, with the help of a second, independent OCR
    (the Internet Archive microfilm scan sim_international-journal-of-experimental-pathology_1929-06_10_3).
    The title, author and affiliation are set in the header of the poster; running heads, page
    numbers and the signature mark are left out; words hyphenated at line ends are joined
    (post-nasal keeps its hyphen, as in the title of Table IV); the spaces before ; and : are not
    kept. Spellings of the print are kept, among them influenzæ beside influenzae, diphtheriæ
    beside diphtheriae, "Pfeiffers bacillus", "It doses not", "Des moissures du group", and
    "(Fildes, 1921)" in the text for the reference dated 1920. The tables are set as tables:
    the dashes that mark no growth in Tables I and IV are set as minus signs; the ditto marks
    are set as ",,"; the sign that marks uncountable colonies in the table of the rate of killing
    is set as ∝, the glyph of the print; the two halves of Table IV, printed side by side (cases
    1 to 13 and 14 to 25), are set as one table; Table III, printed sideways on p. 230, is set
    upright. Tables II and III follow the paragraph that introduces them. The four photographs
    are the plates of the scan, cropped to each figure with its engraved labels, in grayscale;
    their captions are set as printed ("Fig. 4—" without a full stop). The short rule before the
    acknowledgement is kept.
