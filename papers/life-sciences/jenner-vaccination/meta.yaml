  edition: >-
    Excerpt: Case XVI and Case XVII, complete, pp. 31-35 of Edward Jenner, An Inquiry into the
    Causes and Effects of the Variolæ Vaccinæ (London, printed for the author by Sampson Low,
    1798), with Plate No. 1, which Case XVI annexes. Text of the English Wikisource, whose pages
    of this part are all validated (level 4), from File:An Inquiry into the Causes and Effects of
    the Variolæ Vaccinæ - 1798.djvu on Wikimedia Commons, the Internet Archive scan b24759247 of
    the copy of the London School of Hygiene & Tropical Medicine Library; checked word by word
    against the page images of that scan. As in the transcription, the long s is set as s, the
    ligature ct as c t, and the spaces before ; are not kept; words hyphenated at line ends are
    joined; running heads, page numbers, catchwords and signature marks are left out. The
    footnote marked with an asterisk is numbered and set after the text. The case headings keep
    their capitals, set in the heading style of the poster. The rest of the book (the other
    cases and Jenner's discussion) is left out. Plate No. 1: File:An Inquiry Into the Causes and
    Effects of the Variolæ Vaccinæ (1798) - illustration - No. 1.png on Wikimedia Commons (3976 x
    1636 px), the plate extracted from the same Internet Archive scan (its file page credits
    archive.org/details/b24759247), saved as JPEG for the poster; its number and the engraver's
    line, which the file leaves out, are given in the caption as engraved.
