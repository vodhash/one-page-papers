  edition: >-
    The paper as printed in the Verhandlungen des naturforschenden Vereines in Brünn, IV. Band
    (1865, published Brünn 1866), Abhandlungen, pp. 3-47. Text of the Deutsches Textarchiv
    (mendel_pflanzenhybriden_1866, TEI XML, double-keyed from the copy of the BBAW, shelfmark
    Z 981), checked against its page images and against the independent OCR of the Internet
    Archive scan of the Smithsonian Libraries copy (versucheberpflan00mend): every disagreement
    was read on the page images. Corrected against the print: "Anforderungen" (DTA
    Auforderungen, p. 6), "ähnlich" (DTA ähulich, p. 35), "sorgfältigsten" (DTA sorgfaltigsten,
    p. 39). Kept as printed: "Resnltate" and "nnd", which DTA marks as errors of the print, "die
    her besprochen", "gefarbte", "Versuchsjahse". The eleven tables, the eight fraction formulas
    and the arrow diagram of p. 30, which DTA leaves empty, were transcribed from the page images
    (the diagram redrawn as a vector figure); the two tables of p. 21 follow DTA. The title and
    author are set in the header of the poster; running heads, page numbers and signature marks
    are left out; words hyphenated at line ends are joined, except compounds whose second part
    starts with a capital (Befruchtungs-Organe, Stamm-Merkmale...) and the suspended "Keim- und";
    "vor-/der" (p. 5), a division of two words, is set "vor der". Letter-spaced words are set
    letter-spaced; centred and indented lines keep their lines; ditto marks are set as „; dotted
    leaders are set with a short leader of five dots; numbered paragraphs keep their numbers; the
    two footnotes marked *) are numbered by the poster and set at the end of the text.
