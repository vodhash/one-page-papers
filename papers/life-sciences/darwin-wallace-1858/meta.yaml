  edition: >-
    Wikisource transcription, all 18 pages validated, of the paper as printed in the Journal of
    the Proceedings of the Linnean Society, Zoology, vol. III, pp. 45-62 (issue 9, August 1858, as its DOI record at Crossref states),
    from the copy of the Natural History Museum Library, London, scanned by the Internet Archive
    (journalofproceed00linn). Checked word by word against the OCR of that scan and against its
    page images. The heading of the paper (title, authors, communicators) is set in the header of
    the poster, without its "By" and its final full stop; running heads, page numbers and
    signature marks are left out; the two footnotes, marked with an asterisk in the print, are
    numbered and set at the end of the text; words
    hyphenated at line ends are joined, as in the transcription ("well-being" keeps its hyphen);
    the spaces before ; : ? and ! of the period typesetting are not kept. The italics of the
    three part headings follow the print, where the names and "Esq." are roman.
