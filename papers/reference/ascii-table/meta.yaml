  - "Data: RFC 20 (Vint Cerf, UCLA, 1969; Internet Standard STD 80), which copies the code of USAS X3.4-1968. Compilation: MIT."
  - "<i>Names, abbreviations and notes as in the legend of RFC 20; the text was written for this sheet in 2026.</i>"
