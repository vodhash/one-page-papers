source:
  url: https://www.rfc-editor.org/rfc/rfc20.txt
  retrieved: 2026-09-27
  edition: >-
    RFC Editor plain-text edition of RFC 20 (put into machine readable form by Robbie Bennet in
    September 1999), sections 2 (Standard Code) and 4 (Legend). The 128 positions of the code
    table, the control abbreviations and names of legend 4.1 and the graphic names of legend 4.2,
    with their group marks (CC), (FE) and (IS) and their note numbers, were extracted by script
    from that file. The decimal and hexadecimal values are computed from the column and row of
    each position (16 times the column plus the row), as section 3 defines them. In each cell
    the group mark is set as a tag after the name, the note numbers as a superscript, and the
    alternative names in parentheses in italic. The legend's "File Separator IS)" is set as
    "File Separator (IS)". Letters and digits have no name in the legend and get none. The
    notes, the explanation of the table and the lists of groups were written for this sheet
    from sections 1, 3, 4, 5 and 6 of RFC 20; the Internet Standard status comes from the RFC
    Editor's page https://www.rfc-editor.org/info/rfc20 (STD 80).
