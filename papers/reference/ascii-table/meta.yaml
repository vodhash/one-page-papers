title: "ASCII: USA Standard Code for Information Interchange"
summary: "The 128 codes of 7-bit ASCII with their decimal and hexadecimal values and names, as RFC 20 gives them."
title_html: "USA Standard Code<br><em>for Information Interchange</em>"
title_size: 88pt
kicker: "Reference sheet · RFC 20 · USAS X3.4-1968"
author: "Vint Cerf · UCLA"
byline: "Network Working Group · RFC 20, <i>ASCII format for Network Interchange</i> · 16 October 1969"
emblem: "7"
header_scale: 1.4
columns: 4
