    reproduced and translated (unmodified)." IETF Trust FAQ (https://trustee.ietf.org/about/faq/):
    "Since the beginning of the RFC series, reproduction of whole RFCs (including translation
    into a language other than English) has been allowed and encouraged. The IETF Trust and the
    RFC Editor place no restrictions on this.", and on RFCs that predate the IETF: "numerous RFCs
    were published prior to the existence of the IETF (i.e. prior to January 1986). The IETF
    Trust cannot offer definitive advice in these cases." For extracts, the same FAQ says that
    "the IETF Trust will tolerate fair use of other extracts, but you must indicate the source
    of the extract": the footer names RFC 20 and its URL. The names of the legend are the only
    words taken from the RFC.
