  edition: >-
    Federal Aviation Administration, Aeronautical Information Manual, HTML edition on faa.gov,
    Change 3, effective 7/9/2026 (as its index page states), chapter 4, section 2, paragraph
    4-2-7, Phonetic Alphabet, and its table TBL 4-2-7, Phonetic Alphabet/Morse Code (columns
    Character, Morse Code, Telephony, Phonic (Pronunciation); 26 letters, then the figures 1 to
    9 and 0). The paragraph refers to the table as "TBL 4-2-2", but links to TBL 4-2-7. The 36
    rows were extracted by script from the table cells. The Morse code, which the table writes
    with black circles (U+25CF) and em dashes (U+2014) parted by spaces, is drawn as dots and
    bars; the parentheses around each pronunciation are dropped, and "or" between the two
    pronunciations of Charlie and Uniform is kept. Everything else is as in the table, including
    "Xray" and the hyphens of the pronunciations. The texts of the sheet were written for it
    from paragraph 4-2-7. Cross-check, not reproduced: the Morse code of all 36 characters agrees
    with Recommendation ITU-R M.1677-1 (10/2009), Annex 1, 1.1.1 and 1.1.2; the 26 telephony
    words agree with the code words of the ITU Radio Regulations, edition of 2024, Appendix 14
    (Rev.WRC-23), table 1, except "Xray", which Appendix 14 writes "X-ray"; the pronunciations
    agree syllable for syllable, Appendix 14 parting the syllables by spaces rather than hyphens,
    except "HOH-TEL" (Appendix 14: "HOH TELL"). The figure words of the FAA table (One, Two...)
    are not those of the figure code of Appendix 14 (Nadazero, Unaone...). Left out, as the FAA
    table does not have them: the accented e and the 20 punctuation marks and miscellaneous
    signs of M.1677-1 (1.1.1 and 1.1.3), its rules on spacing and on signs without a signal, the
    figure code and the decimal point and full stop of Appendix 14, and the stressed syllables
    that Appendix 14 underlines.
