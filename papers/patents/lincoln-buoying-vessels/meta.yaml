source:
  url: https://patents.google.com/patent/US6469A/en
  retrieved: 2026-09-27
  edition: >-
    Scan of the patent linked from Google Patents
    (https://patentimages.storage.googleapis.com/92/64/49/fe49e21fbf8f09/US6469.pdf, 1-bit, 300 dpi,
    three pages). Its first page is the sheet of drawings, under a typewritten heading ("ABRAHAM
    LINCOLN" / "MANNER OF BOUYING VESSELS" / "No. 6,469" / "Patented May 22, 1849"); the image at the
    top is that sheet without its heading, cropped to the drawing, turned a quarter turn clockwise so
    that the figure labels read horizontally, and kept in black and white. Pages 2 and 3 hold a typeset
    printing of the specification, which is transcribed in full, word for word: an OCR made for this
    poster (RapidOCR) served as a base and every line was checked against the page images (the OCR of
    Google Patents lacks the first part of the text). The printed heading ("UNITED STATES PATENT
    OFFICE" / "ABRAHAM LINCOLN, OF SPRINGFIELD, ILLINOIS." / "BUOYING VESSELS OVER SHOALS." /
    "Specification forming part of Letters Patent No. 6,469, dated May 22, 1849; application filed
    March 10, 1849.") is set in the header of the poster. Normalizations: words divided at line ends
    are rejoined without their hyphen; the page number and running head of page 3 are dropped; the
    spacing of tightly set lines is normalized (a space after each comma, as in "(D, D,)" and "C,
    which"); the italic reference letters (f, g, h, i, e, k, m) are set in italics; a broken letter
    is read as "constructed". The spelling of the print is kept ("draught", "centre", "pullies",
    "letters patent"). The witnesses are in small capitals, as printed. The caption of the drawing
    is not a period text: it was written for this poster from the specification.
