source:
  url: https://patents.google.com/patent/US3541541A/en
  retrieved: 2026-09-27
  edition: >-
    Scan of the printed patent linked from Google Patents
    (https://patentimages.storage.googleapis.com/7d/13/7e/3fd1de4c37ed12/US3541541.pdf, 1-bit, 300 dpi,
    seven pages). Its first three pages, the sheets of drawings, are set side by side in the image at
    the top, each cropped to the drawing, its heading and its signatures and kept in black and white.
    The specification and the eight claims (pages 1 to 4, columns 1 to 8) are transcribed in full,
    word for word from the scan: the text of Google Patents served as a base, an OCR made for this
    poster (RapidOCR) was compared with it by script, every disagreement was settled on the scan, and
    every line was then read against the page images. The printed heading ("United States Patent
    Office" / "3,541,541" / "Patented Nov. 17, 1970" / "X–Y POSITION INDICATOR FOR A DISPLAY SYSTEM" /
    "Douglas C. Engelbart, Palo Alto, Calif., assignor to Stanford Research Institute, Menlo Park,
    Calif., a corporation of California" / "Filed June 21, 1967, Ser. No. 647,872" / "8 Claims", and classification numbers) is set in the header of the poster, without the
    classification numbers, the place of the assignee and its state of incorporation. The list of references cited, the
    names of the examiners and the cross-reference classes printed after the claims are left out.
    Normalizations: words divided at line ends are rejoined without their hyphen ("up-down" and
    "on-off" keep their own); the running heads, column numbers and the line numbers of the margins
    are dropped; the bold type of the reference numerals is not kept; the section headings keep the
    capitals of the print. The spelling of the print is kept, including "digita output", "directon",
    "registation", "Schmidt trigger", "One subject of the invention", "the readout scheme of FIG. 6"
    and "In the readout circuit of FIG. 5" (where FIG. 5 and FIG. 6 seem exchanged), "the disc 100 has
    its axes fixed" and "delay line 124". The caption of the drawings is not a period text: it was
    written for this poster from the specification.
