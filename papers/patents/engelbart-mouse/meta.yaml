    typically not subject to copyright restrictions, the exceptions (37 CFR 1.71(d) and (e), 1.84(s))
    applying only to a copyright or mask work notice printed in the patent, and this one carries none.
    In France, the rule of the shorter term (article L. 123-12 of the Code de la propriété
    intellectuelle, after article 7(8) of the Berne Convention): for a work whose country of origin is
    outside the European Union and whose author is not a national of a member state (Engelbart was a
    US national, Wikidata Q92614), the protection lasts no longer than in the country of origin, which
    grants none.
  note: >-
