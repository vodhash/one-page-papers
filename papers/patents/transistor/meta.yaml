    the rule of the shorter term (article L. 123-12 of the Code de la propriété intellectuelle, after
    article 7(8) of the Berne Convention): for a work whose country of origin is outside the European
    Union and whose authors are not nationals of a member state (Bardeen and Brattain were US
    nationals, Wikidata Q949 and Q184577), the protection lasts no longer than in the country of
    origin, which grants none.
