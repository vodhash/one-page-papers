  edition: >-
    The paper as printed in the Commentarii Academiae Scientiarum Imperialis Petropolitanae,
    Tomus VIII, ad annum 1736 (Petropoli, typis Academiae, 1741), pp. 128-140, with its plate,
    Tab. VIII. The text comes from the diplomatic transcription of Latin Wikisource (raw
    wikitext of the page), read word by word against the scan of that volume in the Internet
    Archive, item commentariiacade08impe (Biodiversity Heritage Library, copy of the American
    Museum of Natural History Library), and compared with its OCR; the scan of the Euler
    Archive (E053, docs/originals/E053.pdf) served as a second witness. The plate is page n185
    of that Internet Archive item, cropped to its frame, turned to greyscale and its paper
    whitened. Differences from Wikisource, all back to the print: "vtendum" (p. 128,
    Wikisource "vrendum"); "queat, an secus" (p. 130); "Ita si quis" and "litteris AB" (p. 130,
    Wikisource "Ita, si" and "litterus"); "perueniat" (p. 131); "quotcunque" and "vnicum" (p.
    132); "coniicio, quae", "numerus pontium" (p. 135, Wikisource "coniicio;" and "numeros");
    "habetur ergo 8" without a period (p. 136); "asterisco noto" and "collocaui" (p. 137,
    Wikisource "asterico", "colocaui"); "litteris A, B, C adscriptos simul sumtos" (p. 137,
    Wikisource "A, B, C etc." and "sumptos"); "Praeterea" and "tendit" (p. 139, Wikisource
    "Praieterea", "Tendit"). Kept as printed: "ABDG" for ABDC in §. 5, "iuuestigandum" (p.
    135) and "asteristico" (p. 135). Normalizations: the long s is set as a round s, and the
    ligatures ct, st, si, ss, fi, fl and ffi as separate letters; u and v are kept as printed;
    "der Kneiphof", printed in Fraktur, is set in the roman of the text; the drop cap of the
    first word is set as a capital P followed by "raeter"; the heading "§. 1.", centred in the
    print, opens its paragraph; the marginal notes "Tabula VIII." and "Figura 1." to "Figura
    3." are left out (the Wikisource transcription sets the latter within the text); running
    heads, page numbers and signature marks are dropped, and words hyphenated at line ends
    are rejoined. The two tables of §. 14 and §. 15 are set as tables, their dashes as rules.
