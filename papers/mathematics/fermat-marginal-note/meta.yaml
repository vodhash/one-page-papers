  edition: >-
    Excerpt of page 61 of Diophanti Alexandrini Arithmeticorum libri sex, et De numeris
    multangulis liber vnus, cum commentariis C. G. Bacheti V. C. et obseruationibus D. P. de
    Fermat senatoris Tolosani (Tolosae, Bernard Bosc, 1670), edited by Samuel de Fermat. Kept:
    the Latin of Quæstio VIII of Book II (Bachet's translation) and the Observatio Domini Petri
    de Fermat printed under it, both complete; left out: the Greek text of the question, which
    faces the Latin, and the rest of the page. The text comes from the OCR of the Internet
    Archive item bub_gb_yx9VIgeaCEYC (copy of the Biblioteca Nazionale Centrale di Roma,
    digitized by Google), in which nearly every line is garbled: each line was corrected on
    the scan of that page and of a second copy (bub_gb__iGRuJyOtNUC, Biblioteca Nazionale
    Centrale di Firenze), whose OCR of the observation agrees. The four fractions, printed in
    small type, were read on both scans and are consistent (16/5 and its square 256/25; 144/25;
    400/25). Normalizations: the long s is set as a round s and the ct ligature as two letters;
    u and v, æ and the accents (à, verò) are kept as printed; the drop caps are set as capitals
    ("Propositvm", its rest in small capitals as printed, and "Cvbum", printed with a capital
    V after the drop cap); the minus sign, printed as a dash, is set as a minus sign; words
    hyphenated at line ends are rejoined. The page image is the Florence copy, cropped, turned
    to greyscale and its paper whitened.
