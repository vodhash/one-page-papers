title: "Letter to G. H. Hardy, 16 January 1913"
summary: "Ramanujan, a clerk in Madras, introduces himself to Hardy and sends him his theorems."
title_html: "Letter to G. H. Hardy<br><em>Madras, 16 January 1913</em>"
title_size: 88pt
kicker: "Excerpt · The covering letter of Ramanujan’s first letter to Hardy"
author: "Srinivasa Ramanujan"
