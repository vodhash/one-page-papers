  basis: >-
    Euclid's text is ancient; the editor, Johan Ludvig Heiberg, died on 4 January 1928
    (Wikidata Q936503), and the edition was published in 1883: it is in the public domain in
    France, where its author and editor died before 1 January 1956, and in the United States,
    where it was published before 1 January 1931. The Internet Archive gives the Toronto scan
    the possible-copyright-status NOT_IN_COPYRIGHT.
  note: >-
    Greek Wikisource serves as the transcription only: its text is Heiberg's public domain
    text, every word of which was checked on the 1883 scan, and no editorial matter of
    Wikisource is kept. The Perseus Digital Library text of Heiberg (CC BY-SA) was not used.
