  edition: >-
    The letter as printed in the Journal de mathématiques pures et appliquées, 1re série, tome
    XI (November 1846), pp. 408-415, within the Œuvres mathématiques d'Évariste Galois (pp.
    381-444), not the first printing of the Revue encyclopédique (September 1832, p. 568), whose
    text differs in places. The text comes from the text layer (OCR) of the NUMDAM PDF of that
    printing, corrected word by word, and every formula read again, against two scans: NUMDAM
    (digitized by the BnF for Gallica) and the Internet Archive item s1journaldemat11liou
    (University of Toronto copy); the proofread text of the 1897 Gauthier-Villars edition on
    French Wikisource served as a cross-check only. The heading "Lettre de Galois à M. Auguste
    Chevalier" is the title of the poster; the line under it, "(Insérée en 1832 dans la Revue
    encyclopédique ...)", opens the text and carries the note that the print calls from the
    heading. The two notes signed (J. L.) are kept as footnotes; the Note de M. Liouville that
    follows the letter is left out. Running heads, page numbers, the foot line of p. 409 and the
    signature marks of the sheets are dropped; words hyphenated at line ends are rejoined; the
    spaces that the typesetter put before commas are not kept, and a colon keeps its space
    before it, made unbreakable. The formulas are set with KaTeX: the capitals of groups and
    functions are upright, as printed, the minus signs, printed with a dash, are set as minus
    signs, and "M² = 1" is set as text.
license:
