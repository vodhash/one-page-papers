  holder: "Évariste Galois, 1832; notes by Joseph Liouville, 1846"
  basis: >-
    Évariste Galois died on 31 May 1832 (Wikidata Q7091) and Joseph Liouville, who signed the
    notes (J. L.), on 8 September 1882 (Wikidata Q214549); the letter was published in 1832 and
    this edition in 1846. The text is in the public domain in France, where both authors died
    before 1 January 1956, and in the United States, where it was published before 1 January
    1931. The NUMDAM conditions of use state that "les documents du domaine public" may be
    republished without explicit permission (https://www.numdam.org/conditions/).
