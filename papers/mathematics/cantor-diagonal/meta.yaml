  edition: >-
    The paper as printed in the Jahresbericht der Deutschen Mathematiker-Vereinigung, Erster
    Band, 1890-91 (Berlin, Georg Reimer, 1892), pp. 75-78, in the report on the scientific
    sessions of the meeting at Halle, 22 to 26 September 1891; complete. The text comes from
    the OCR of the Internet Archive item jahresberichtder1218deut (University of Illinois
    copy, leaves 84 to 87), corrected on the scan of the same pages: every line was read
    against the page images, and the lines that the OCR garbles (the formulas and every
    subscript) were set from the scan. Running heads and page numbers are dropped, words
    hyphenated at line ends are rejoined, and the paragraph breaks and centred displays
    follow the print. The byline "Von Georg Cantor (Halle a. S.)." is in the header.
    Typography: variables are upright, as printed, with HTML subscripts and superscripts;
    the leaders of the print (". . .") are set as ellipses; the signs "≧" and "≦" are set
    with KaTeX; the rows of dots under the display of E1, E2, ..., Eμ are kept.
