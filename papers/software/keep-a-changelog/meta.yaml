  edition: >-
    The English page of version 1.1.0 on keepachangelog.com. The title of the page is the title
    of the poster, its tagline is set under it and its version link is the kicker, with the date
    of version 1.1.0 in the example changelog of the page. The example changelog is set in
    monospace across the page, in columns, line for line. Links are set as plain text. The
    credits line of the page footer is in the footer of the poster, and the MIT notice of the
    repository is printed at the end of the text. Nothing else is left out.
