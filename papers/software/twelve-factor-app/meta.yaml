  edition: >-
    The English pages of 12factor.net, whose footer reads "Written by Adam Wiggins • Last
    updated 2017", rendered from content/en of github.com/heroku/12factor (commit 1385d2c): the
    home page (Introduction, Background, Who should read this document? and the heading The
    Twelve Factors), then the twelve factor pages in order. The list of the twelve factors on the
    home page repeats the titles and summaries that head the factor pages, so they are set once,
    as the headings of the factors. Links are set as plain text. The four diagrams of the pages
    (public/images of the repository) are redrawn as vector graphics with their labels; their
    alternative texts, which the pages do not display, are left out. The MIT notice of the
    repository is printed at the end of the text.
