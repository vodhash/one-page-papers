title: "The GNU Manifesto"
summary: "Richard Stallman's 1985 call for support to write GNU, a complete Unix-compatible system that everyone may share and change."
title_html: "The GNU <em>Manifesto</em>"
title_size: 110pt
kicker: "GNU Project · 1985"
author: "Richard Stallman"
emblem: "GNU"
abstract: >-
  <span class="p">The GNU Manifesto (which appears below) was written by Richard Stallman in 1985
  to ask for support in developing the GNU operating system. Part of the text was taken from the
  original announcement of 1983. Through 1987, it was updated in minor ways to account for
  developments; since then, it seems best to leave it unchanged.</span><span class="p">Since that
  time, we have learned about certain common misunderstandings that different wording could help
  avoid. Footnotes added since 1993 help clarify these points.</span><span class="p">If you want
  to install the GNU/Linux system, we recommend you use one of the 100% free software GNU/Linux
  distributions. For how to contribute, see gnu.org/help.</span><span class="p">The GNU Project is
  part of the Free Software Movement, a campaign for freedom for users of software. It is a
  mistake to associate GNU with the term “open source”—that term was coined in 1998 by people who
  disagree with the Free Software Movement's ethical values. They use it to promote an amoral
  approach to the same field.</span>
