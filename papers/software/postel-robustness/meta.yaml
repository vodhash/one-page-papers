title: "RFC 761: The Robustness Principle"
summary: "The philosophy chapter of the 1980 TCP specification, which ends with the principle: be conservative in what you do."
title_html: "Transmission Control Protocol<br><em>Philosophy</em>"
kicker: "Request for Comments 761 · Excerpt · January 1980"
author: "Jon Postel, Editor"
byline: "Information Sciences Institute · University of Southern California"
emblem: "TCP"
abstract_label: "Preface."
abstract: >-
  This document describes the DoD Standard Transmission Control Protocol (TCP). There have
  been eight earlier editions of the ARPA TCP specification on which this standard is based,
  and the present text draws heavily from them. There have been many contributors to this
  work both in terms of concepts and in terms of text. This edition incorporates the
  addition of security, compartmentation, and precedence concepts into the TCP
  specification.
